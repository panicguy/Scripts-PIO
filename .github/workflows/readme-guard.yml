name: README Branding Guard

on:
  push:
    paths:
      - README.md
      - autodex.user.js
      - assets/pio-scripts-logo.png
      - scripts/check-readme.cjs
      - .github/workflows/readme-guard.yml
  pull_request:
    paths:
      - README.md
      - autodex.user.js
      - assets/pio-scripts-logo.png
      - scripts/check-readme.cjs
      - .github/workflows/readme-guard.yml

jobs:
  verify-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve README brand and validate AutoDex version
        run: node scripts/check-readme.cjs
